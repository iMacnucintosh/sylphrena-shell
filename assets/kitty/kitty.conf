# Sylphrena colours for kitty: the shell fills the {{ … }} variables from the current scheme and writes
# ~/.local/state/sylphrena/theme/kitty.conf (see scripts/setup-kitty.py). Copy it to
# ~/.config/sylphrena/templates/kitty.conf to change it: the copy is never overwritten.
foreground              #{{ onSurface.hex }}
background              #{{ surface.hex }}
cursor                  #{{ secondary.hex }}
selection_foreground    #{{ onSecondary.hex }}
selection_background    #{{ secondary.hex }}
url_color               #{{ primary.hex }}
active_border_color     #{{ primary.hex }}
inactive_border_color   #{{ outline.hex }}
bell_border_color       #{{ error.hex }}

color0  #{{ term0.hex }}
color1  #{{ term1.hex }}
color2  #{{ term2.hex }}
color3  #{{ term3.hex }}
color4  #{{ term4.hex }}
color5  #{{ term5.hex }}
color6  #{{ term6.hex }}
color7  #{{ term7.hex }}
color8  #{{ term8.hex }}
color9  #{{ term9.hex }}
color10 #{{ term10.hex }}
color11 #{{ term11.hex }}
color12 #{{ term12.hex }}
color13 #{{ term13.hex }}
color14 #{{ term14.hex }}
color15 #{{ term15.hex }}
